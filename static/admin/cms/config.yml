backend:
  name: github
  repo: trikset/trik-help
  branch: trik-help-doc
  base_url: https://help-new.trikset.com
  squash_merges: true

publish_mode: editorial_workflow

media_folder: "static/gitbook/assets"
public_folder: "/gitbook/assets"

locale: "ru"
display_url: "https://help-new.trikset.com"
site_url: "https://help-new.trikset.com"
logo_url: "/img/logo.svg"

collections:
  - name: "docs_intro"
    label: "Вводная страница"
    description: "Главная страница справки docs/intro.md."
    files:
      - name: "intro"
        label: "Справочный центр ТРИК"
        file: "docs/intro.md"
        fields:
          - { name: "title", label: "Заголовок страницы", widget: "string" }
          - { name: "body", label: "Текст страницы", widget: "markdown", hint: "Обычный текст редактируется как Markdown/MDX. Якоря пишутся как &#123;#id&#125;, картинки могут быть в Markdown или HTML, Tabs/TabItem — это вкладки." }
  - name: "docs_studio"
    label: "TRIK Studio"
    label_singular: "Страница"
    description: "Страницы раздела TRIK Studio. Новые страницы можно создавать здесь; чтобы добавить страницу в левое меню сайта, обновите коллекцию «Меню справки»."
    folder: "docs/studio"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}"
    slug: "{{slug}}"
    nested:
      depth: 8
      summary: "{{title}}"
      subfolders: true
    fields:
      - { name: "title", label: "Заголовок страницы", widget: "string" }
      - { name: "sidebar_label", label: "Короткое название в меню", widget: "string", required: false, hint: "Необязательно. Главное левое меню задаётся в коллекции «Меню справки»." }
      - { name: "description", label: "Описание для SEO", widget: "text", required: false }
      - { name: "body", label: "Текст страницы", widget: "markdown" }
