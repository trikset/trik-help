name: Import main-ru and convert

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: GitBook source branch to import
        required: true
        default: main-ru
      target_branch:
        description: Docusaurus branch to update
        required: true
        default: trik-help-doc

permissions:
  contents: write

jobs:
  import-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Convert from source branch
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: ./scripts/import_main_ru_and_convert.sh

      - name: Commit converted docs
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if git diff --quiet; then
            echo "No changes after conversion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs sidebars.ts static/gitbook migration docusaurus.config.ts src/pages/index.tsx
          git commit -m "Import ${SOURCE_BRANCH} and convert to Docusaurus"
          git push origin HEAD:${TARGET_BRANCH}
